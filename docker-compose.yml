# Bunwrite with Docker Compose. The app auto-tunes itself from the host (or
# from the cgroup limits below), so the same file works on a small VPS or a
# larger machine.
#
#   cp .env.example .env    # set DOMAIN; COMPOSE_PROFILES controls the bundled Caddy
#                           # and TLS_MODE=acme|external|off picks who owns TLS
#   docker compose up -d --build
#
# See docs/DEPLOY.md ("Docker Compose") for admin setup, functions and backups.

services:
  bunwrite:
    build:
      context: .
      args:
        # Set to true if you run python-* functions.
        WITH_PYTHON: ${BUNWRITE_WITH_PYTHON:-false}
        # Set to true for HTML to PDF and images (adds Chromium).
        # Then enable it in Console > Settings > HTML rendering.
        WITH_CHROMIUM: ${BUNWRITE_WITH_CHROMIUM:-false}
    image: bunwrite:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # The container always listens on 8080; change the published port below instead.
      HOST: 0.0.0.0
      PORT: 8080
      # One HTTP process per CPU (Linux SO_REUSEPORT). Set WORKERS=1 for a
      # single process, or a number to pin the count.
      WORKERS: ${WORKERS:-auto}
      # Caddy compresses HTTP responses at the edge; compressing in the workers
      # as well only spends CPU. Set COMPRESSION=true when Bunwrite is exposed
      # directly, without a proxy.
      COMPRESSION: ${COMPRESSION:-false}
      DATABASE_PATH: /app/data/bunwrite.sqlite
      STORAGE_PATH: /app/data/storage
      BACKUPS_PATH: /app/data/backups
      FUNCTIONS_ENV_FILE: /app/functions/functions.env
      # Each function builds and runs as its own user. `on` refuses to start
      # without that isolation instead of silently running code as the server's
      # user; the image ships the helper, so Docker uses `on`. Set `auto` or
      # `off` to opt out, or to run with no-new-privileges (which blocks the
      # helper, so `on` would stop the container from starting).
      FUNCTIONS_SANDBOX: ${FUNCTIONS_SANDBOX:-on}
      # PUBLIC_ENDPOINT defaults to https://$DOMAIN/v1; override it in .env when
      # TLS is terminated somewhere else.
      DOMAIN: ${DOMAIN:-}
      # Image previews, renders, SQLite cache, upload size, JSC heap and malloc
      # arenas are auto-tuned. Set any of them in .env to override autotune.
      # Chromium for HTML rendering (only present when built with WITH_CHROMIUM=true).
      CHROME_PATH: /usr/bin/chromium
      CHROME_NO_SANDBOX: "true"
    ports:
      # Only on loopback: Caddy below is the public entry point. Set
      # BUNWRITE_BIND=0.0.0.0 to expose the app directly instead.
      - "${BUNWRITE_BIND:-127.0.0.1}:${BUNWRITE_PORT:-8080}:8080"
    volumes:
      - bunwrite-data:/app/data
      # appwrite.config.json and function code. Set SCHEMA_PATH=/app/functions/appwrite.config.json.
      # - ./functions:/app/functions:ro
    # Bunwrite reads these cgroup limits when they are set, so it stays inside
    # them automatically. Uncomment cpus/memory on a shared VPS, then set
    # memswap_limit to the same memory value if you want no swap.
    deploy:
      resources:
        limits:
          # cpus: "2"
          # memory: 2G
          # Chromium and function runs use many processes; this stops a fork bomb.
          pids: 512
    # memswap_limit: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Automatic HTTPS for DOMAIN. Opt in with COMPOSE_PROFILES=caddy in .env (see
  # .env.example); without the profile this service is skipped and you can use
  # your own reverse proxy. Caddy obtains and renews the certificate itself; it
  # only needs DNS pointing here and ports 80/443 open. Certificate state is
  # kept in the caddy-data volume, so restarts do not re-issue certificates.
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bunwrite
    # Wait for DOMAIN to point here before starting, so a first install can run
    # before DNS has propagated without burning ACME attempts and backing off.
    entrypoint: ["/bin/sh", "/usr/local/bin/caddy-entrypoint.sh"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # acme (Caddy obtains certificates), external (TLS_CERT_FILE/TLS_KEY_FILE)
      # or off (an upstream proxy/tunnel terminates TLS).
      TLS_MODE: ${TLS_MODE:-acme}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      CADDY_WAIT_DNS: ${CADDY_WAIT_DNS:-}
      CADDY_WAIT_IP: ${CADDY_WAIT_IP:-}
      CADDY_WAIT_INTERVAL: ${CADDY_WAIT_INTERVAL:-10}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.external:/etc/caddy/Caddyfile.external:ro
      - ./Caddyfile.off:/etc/caddy/Caddyfile.off:ro
      - ./scripts/caddy-entrypoint.sh:/usr/local/bin/caddy-entrypoint.sh:ro
      # Certificates for TLS_MODE=external; ignored in the other modes.
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bunwrite-data:
  caddy-data:
  caddy-config:
