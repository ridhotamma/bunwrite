# Bunwrite with Docker Compose. The app auto-tunes itself from the host (or
# from the cgroup limits below), so the same file works on a small VPS or a
# larger machine.
#
#   cp .env.example .env    # optional: set PUBLIC_ENDPOINT and other overrides
#   docker compose up -d --build
#
# See docs/DEPLOY.md ("Docker Compose") for admin setup, functions and backups.

services:
  bunwrite:
    build:
      context: .
      args:
        # Set to true if you run python-* functions.
        WITH_PYTHON: ${BUNWRITE_WITH_PYTHON:-false}
        # Set to true for HTML to PDF and images (adds Chromium).
        # Then enable it in Console > Settings > HTML rendering.
        WITH_CHROMIUM: ${BUNWRITE_WITH_CHROMIUM:-false}
    image: bunwrite:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # The container always listens on 8080; change the published port below instead.
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /app/data/bunwrite.sqlite
      STORAGE_PATH: /app/data/storage
      BACKUPS_PATH: /app/data/backups
      FUNCTIONS_ENV_FILE: /app/functions/functions.env
      # Image previews, renders, SQLite cache, upload size, JSC heap and malloc
      # arenas are auto-tuned. Set any of them in .env to override autotune.
      # Chromium for HTML rendering (only present when built with WITH_CHROMIUM=true).
      CHROME_PATH: /usr/bin/chromium
      CHROME_NO_SANDBOX: "true"
    ports:
      # Use 127.0.0.1:8080:8080 when a reverse proxy on this host is the only entry point.
      - "${BUNWRITE_PORT:-8080}:8080"
    volumes:
      - bunwrite-data:/app/data
      # appwrite.config.json and function code. Set SCHEMA_PATH=/app/functions/appwrite.config.json.
      # - ./functions:/app/functions:ro
    # Bunwrite reads these cgroup limits when they are set, so it stays inside
    # them automatically. Uncomment cpus/memory on a shared VPS, then set
    # memswap_limit to the same memory value if you want no swap.
    deploy:
      resources:
        limits:
          # cpus: "2"
          # memory: 2G
          # Chromium and function runs use many processes; this stops a fork bomb.
          pids: 512
    # memswap_limit: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bunwrite-data:
