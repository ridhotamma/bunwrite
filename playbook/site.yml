---
# Provision a fresh Ubuntu/Debian VPS and run Bunwrite as a systemd service.
# Usage: see playbook/README.md.
- name: Provision Bunwrite
  hosts: bunwrite
  become: true
  gather_facts: true
  vars:
    bunwrite_user: bunwrite
    bunwrite_group: bunwrite
    bunwrite_home: "/home/{{ bunwrite_user }}"
    bunwrite_dir: /opt/bunwrite
    bunwrite_repo: https://github.com/ridhotamma/bunwrite.git
    bunwrite_version: main
    bunwrite_port: 8080
    bunwrite_project_id: bunwrite
    bunwrite_project_name: Bunwrite
    bunwrite_domain: ""
    bunwrite_allowed_origins: "*"
    bunwrite_admin_email: admin@bunwrite.local
    bunwrite_admin_password: ""
    bunwrite_secret: ""
    bunwrite_api_key: ""
    bunwrite_secret_value: ""
    bunwrite_api_key_value: ""
    bunwrite_admin_password_value: ""
    bunwrite_public_endpoint: >-
      {{
        ('https://' ~ bunwrite_domain ~ '/v1')
        if (bunwrite_domain | length > 0)
        else ('http://' ~ ((ansible_facts['default_ipv4'] | default({}))['address'] | default(ansible_host)) ~ ':' ~ bunwrite_port ~ '/v1')
      }}
    bunwrite_console_url: >-
      {{
        ('https://' ~ bunwrite_domain ~ '/console')
        if (bunwrite_domain | length > 0)
        else ('http://' ~ ((ansible_facts['default_ipv4'] | default({}))['address'] | default(ansible_host)) ~ ':' ~ bunwrite_port ~ '/console')
      }}
    bunwrite_caddy_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - unzip
          - python3
          - build-essential
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create service group
      ansible.builtin.group:
        name: "{{ bunwrite_group }}"
        system: true

    - name: Create service user
      ansible.builtin.user:
        name: "{{ bunwrite_user }}"
        group: "{{ bunwrite_group }}"
        home: "{{ bunwrite_home }}"
        shell: /bin/bash
        system: true
        create_home: true

    - name: Install Bun
      ansible.builtin.shell:
        cmd: curl -fsSL https://bun.sh/install | bash
        creates: /usr/local/bin/bun
      environment:
        BUN_INSTALL: /usr/local

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ bunwrite_dir }}"
        state: directory
        owner: "{{ bunwrite_user }}"
        group: "{{ bunwrite_group }}"
        mode: "0755"

    - name: Clone or update the source
      ansible.builtin.git:
        repo: "{{ bunwrite_repo }}"
        dest: "{{ bunwrite_dir }}"
        version: "{{ bunwrite_version }}"
        update: true
      become_user: "{{ bunwrite_user }}"
      environment:
        HOME: "{{ bunwrite_home }}"

    - name: Install production dependencies
      ansible.builtin.command:
        cmd: /usr/local/bin/bun install --frozen-lockfile --production
        chdir: "{{ bunwrite_dir }}"
      become_user: "{{ bunwrite_user }}"
      environment:
        HOME: "{{ bunwrite_home }}"
      changed_when: false

    - name: Build the standalone binary
      ansible.builtin.command:
        cmd: /usr/local/bin/bun run build
        chdir: "{{ bunwrite_dir }}"
      become_user: "{{ bunwrite_user }}"
      environment:
        HOME: "{{ bunwrite_home }}"

    - name: Install the binary
      ansible.builtin.copy:
        src: "{{ bunwrite_dir }}/dist/bunwrite"
        dest: /usr/local/bin/bunwrite
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Create data directories
      ansible.builtin.file:
        path: "{{ bunwrite_dir }}/{{ item }}"
        state: directory
        owner: "{{ bunwrite_user }}"
        group: "{{ bunwrite_group }}"
        mode: "0750"
      loop:
        - data
        - data/storage
        - data/backups

    - name: Check for the environment file
      ansible.builtin.stat:
        path: "{{ bunwrite_dir }}/.env"
      register: bunwrite_env

    - name: Generate first-run secrets
      ansible.builtin.set_fact:
        bunwrite_secret_value: "{{ bunwrite_secret | default('', true) or lookup('password', '/dev/null length=64 chars=hexdigits') }}"
        bunwrite_api_key_value: "{{ bunwrite_api_key | default('', true) or lookup('password', '/dev/null length=48 chars=hexdigits') }}"
        bunwrite_admin_password_value: "{{ bunwrite_admin_password | default('', true) or lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      when: not bunwrite_env.stat.exists

    - name: Write the initial environment file
      ansible.builtin.copy:
        dest: "{{ bunwrite_dir }}/.env"
        owner: "{{ bunwrite_user }}"
        group: "{{ bunwrite_group }}"
        mode: "0600"
        force: false
        content: |
          HOST={{ '127.0.0.1' if (bunwrite_domain | length > 0) else '0.0.0.0' }}
          PORT={{ bunwrite_port }}
          PROJECT_ID={{ bunwrite_project_id }}
          PROJECT_NAME={{ bunwrite_project_name }}
          SECRET={{ bunwrite_secret_value }}
          API_KEYS={{ bunwrite_api_key_value }}
          PUBLIC_ENDPOINT={{ bunwrite_public_endpoint }}
          ALLOWED_ORIGINS={{ bunwrite_allowed_origins }}
          DATABASE_PATH=./data/bunwrite.sqlite
          STORAGE_PATH=./data/storage
          CONSOLE_ENABLED=true
          CONSOLE_ADMIN_EMAIL={{ bunwrite_admin_email }}
          CONSOLE_ADMIN_PASSWORD={{ bunwrite_admin_password_value }}
          FUNCTIONS_DIR=.
      when: not bunwrite_env.stat.exists

    - name: Apply non-secret environment settings
      ansible.builtin.lineinfile:
        path: "{{ bunwrite_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: HOST, value: "{{ '127.0.0.1' if (bunwrite_domain | length > 0) else '0.0.0.0' }}" }
        - { key: PORT, value: "{{ bunwrite_port }}" }
        - { key: PROJECT_ID, value: "{{ bunwrite_project_id }}" }
        - { key: PROJECT_NAME, value: "{{ bunwrite_project_name }}" }
        - { key: PUBLIC_ENDPOINT, value: "{{ bunwrite_public_endpoint }}" }
        - { key: ALLOWED_ORIGINS, value: "{{ bunwrite_allowed_origins }}" }
        - { key: DATABASE_PATH, value: "./data/bunwrite.sqlite" }
        - { key: STORAGE_PATH, value: "./data/storage" }
        - { key: CONSOLE_ENABLED, value: "true" }
        - { key: FUNCTIONS_DIR, value: "." }
      loop_control:
        label: "{{ item.key }}"

    - name: Secure the environment file
      ansible.builtin.file:
        path: "{{ bunwrite_dir }}/.env"
        owner: "{{ bunwrite_user }}"
        group: "{{ bunwrite_group }}"
        mode: "0600"

    - name: Install the systemd unit
      ansible.builtin.template:
        src: templates/bunwrite.service.j2
        dest: /etc/systemd/system/bunwrite.service
        owner: root
        group: root
        mode: "0644"

    - name: Start Bunwrite
      ansible.builtin.systemd:
        name: bunwrite
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Wait for the health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ bunwrite_port }}/v1/health"
        status_code: 200
        use_proxy: false
      register: bunwrite_health
      until: bunwrite_health.status == 200
      retries: 30
      delay: 1

    - name: Install Caddy for automatic HTTPS
      when: bunwrite_domain | length > 0
      block:
        - name: Create Caddy group
          ansible.builtin.group:
            name: caddy
            system: true

        - name: Create Caddy user
          ansible.builtin.user:
            name: caddy
            group: caddy
            system: true
            create_home: false
            shell: /usr/sbin/nologin

        - name: Create Caddy directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: caddy
            group: caddy
            mode: "0750"
          loop:
            - /etc/caddy
            - /var/lib/caddy
            - /var/log/caddy

        - name: Download Caddy
          ansible.builtin.get_url:
            url: "https://caddyserver.com/api/download?os=linux&arch={{ bunwrite_caddy_arch }}"
            dest: /usr/local/bin/caddy
            owner: root
            group: root
            mode: "0755"
            force: false
            timeout: 300

        - name: Configure the reverse proxy
          ansible.builtin.copy:
            dest: /etc/caddy/Caddyfile
            owner: root
            group: root
            mode: "0644"
            content: |
              {{ bunwrite_domain }} {
                encode zstd gzip
                reverse_proxy 127.0.0.1:{{ bunwrite_port }}
              }

        - name: Install the Caddy systemd unit
          ansible.builtin.template:
            src: templates/caddy.service.j2
            dest: /etc/systemd/system/caddy.service
            owner: root
            group: root
            mode: "0644"

        - name: Start Caddy
          ansible.builtin.systemd:
            name: caddy
            daemon_reload: true
            enabled: true
            state: restarted

    - name: Show first-run credentials
      ansible.builtin.debug:
        msg:
          - "Bunwrite is running."
          - "Console: {{ bunwrite_console_url }}"
          - "API endpoint: {{ bunwrite_public_endpoint }}"
          - "Admin email: {{ bunwrite_admin_email }}"
          - "Admin password: {{ bunwrite_admin_password_value }}"
          - "API key: {{ bunwrite_api_key_value }}"
          - "These are also stored in {{ bunwrite_dir }}/.env."
      when: not bunwrite_env.stat.exists

    - name: Show access details
      ansible.builtin.debug:
        msg:
          - "Console: {{ bunwrite_console_url }}"
          - "API endpoint: {{ bunwrite_public_endpoint }}"
          - "Configuration: {{ bunwrite_dir }}/.env"
      when: bunwrite_env.stat.exists
