# Generated by `bunwrite install`. Re-run `bunwrite upgrade` to update it.
#
# The Caddy bind mounts use absolute host paths because this file is also
# applied by the installer container through the mounted Docker socket. Edit
# `.env` for settings; this file is replaced on upgrade (the old one is kept as
# a timestamped backup).
name: bunwrite

services:
  bunwrite:
    image: "__BUNWRITE_IMAGE__"
    restart: unless-stopped
    init: true
    # Do not add no-new-privileges: the function sandbox helper needs its file
    # capabilities to switch users. Function processes get --no-new-privs.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      WORKERS: ${WORKERS:-auto}
      WORKER_PORTS: ${WORKER_PORTS:-false}
      MAX_INFLIGHT: ${MAX_INFLIGHT:-200}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-30}
      SQLITE_WAL_AUTOCHECKPOINT: ${SQLITE_WAL_AUTOCHECKPOINT:-10000}
      COMPRESSION: ${COMPRESSION:-false}
      DATABASE_PATH: /app/data/bunwrite.sqlite
      STORAGE_PATH: /app/data/storage
      BACKUPS_PATH: /app/data/backups
      FUNCTIONS_ENV_FILE: /app/functions/functions.env
      FUNCTIONS_SANDBOX: ${FUNCTIONS_SANDBOX:-on}
      DOMAIN: ${DOMAIN:-}
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      LITESTREAM_SYNC_INTERVAL: ${LITESTREAM_SYNC_INTERVAL:-1s}
      LITESTREAM_CONFIG: ${LITESTREAM_CONFIG:-/app/litestream.yml}
      LITESTREAM_ALLOW_EMPTY: ${LITESTREAM_ALLOW_EMPTY:-}
      LITESTREAM_FORCE_RESTORE: ${LITESTREAM_FORCE_RESTORE:-}
      LITESTREAM_HEARTBEAT_URL: ${LITESTREAM_HEARTBEAT_URL:-}
      LITESTREAM_S3_ENDPOINT: ${LITESTREAM_S3_ENDPOINT:-}
      LITESTREAM_S3_REGION: ${LITESTREAM_S3_REGION:-}
      LITESTREAM_S3_FORCE_PATH_STYLE: ${LITESTREAM_S3_FORCE_PATH_STYLE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      CHROME_PATH: /usr/bin/chromium
      CHROME_NO_SANDBOX: ${CHROME_NO_SANDBOX:-false}
    ports:
      # Only on loopback by default: Caddy is the public entry point. Set
      # BUNWRITE_BIND=0.0.0.0 to expose Bunwrite directly.
      - "${BUNWRITE_BIND:-127.0.0.1}:${BUNWRITE_PORT:-8080}:8080"
    volumes:
      - bunwrite-data:/app/data
      # Uncomment after putting appwrite.config.json and function code here:
      # - '__BUNWRITE_HOST_PATH__/functions:/app/functions:ro'
    deploy:
      resources:
        limits:
          # Chromium and function runs use many processes; this stops a fork bomb.
          pids: 512
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    # COMPOSE_PROFILES=caddy in .env enables this service. Leave it empty to use
    # your own reverse proxy in front of BUNWRITE_BIND:BUNWRITE_PORT.
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bunwrite
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    entrypoint: ["/bin/sh", "/usr/local/bin/caddy-entrypoint.sh"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      UPSTREAM: ${UPSTREAM:-bunwrite:8080}
      ASK_UPSTREAM: ${ASK_UPSTREAM:-bunwrite:8080}
      TLS_MODE: ${TLS_MODE:-acme}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      CADDY_WAIT_DNS: ${CADDY_WAIT_DNS:-}
      CADDY_WAIT_IP: ${CADDY_WAIT_IP:-}
      CADDY_WAIT_INTERVAL: ${CADDY_WAIT_INTERVAL:-10}
    ports:
      - "${BUNWRITE_HTTP_BIND:-0.0.0.0}:${BUNWRITE_HTTP_PORT:-80}:80"
      - "${BUNWRITE_HTTP_BIND:-0.0.0.0}:${BUNWRITE_HTTPS_PORT:-443}:443"
      - "${BUNWRITE_HTTP_BIND:-0.0.0.0}:${BUNWRITE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - '__BUNWRITE_HOST_PATH__/Caddyfile:/etc/caddy/Caddyfile:ro'
      - '__BUNWRITE_HOST_PATH__/Caddyfile.external:/etc/caddy/Caddyfile.external:ro'
      - '__BUNWRITE_HOST_PATH__/Caddyfile.off:/etc/caddy/Caddyfile.off:ro'
      - '__BUNWRITE_HOST_PATH__/caddy-entrypoint.sh:/usr/local/bin/caddy-entrypoint.sh:ro'
      - '${TLS_CERT_DIR:-__BUNWRITE_HOST_PATH__/certs}:/certs:ro'
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bunwrite-data:
  caddy-data:
  caddy-config:
