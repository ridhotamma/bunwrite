name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          # GitHub's Ubuntu runners cannot start Chromium's sandbox (no unprivileged
          # user namespaces), so headless Chrome exits before the render starts.
          CHROME_NO_SANDBOX: 'true'
      - run: bun run build
      - run: ./dist/bunwrite --help
