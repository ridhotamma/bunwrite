name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bunwrite
          POSTGRES_PASSWORD: bunwrite
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bunwrite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BUNWRITE_TEST_POSTGRES_URL: postgres://bunwrite:bunwrite@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - id: bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
        with:
          bun-version: 1.4.4
      # GitHub release downloads occasionally return 504. The npm package ships
      # the same binary and is served from the npm registry, so use it as a
      # fallback instead of failing the whole test job.
      - name: Install Bun from npm fallback
        if: steps.bun.outcome == 'failure'
        run: |
          npm install -g bun@1.4.4 --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=20000
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run lint
      # Function isolation tests need the helper the Docker image ships:
      # setpriv with setuid/setgid capabilities, runnable by this user's group.
      - name: Prepare function isolation helper
        run: |
          command -v setcap || sudo apt-get install -y libcap2-bin
          sudo mkdir -p /usr/local/libexec
          sudo install -o root -g "$(id -gn)" -m 0750 "$(command -v setpriv)" /usr/local/libexec/bunwrite-sandbox
          sudo setcap cap_setuid,cap_setgid+ep /usr/local/libexec/bunwrite-sandbox
          # Function users must be able to reach bun and the checkout.
          for p in "$(dirname "$(readlink -f "$(command -v bun)")")" "$GITHUB_WORKSPACE"; do
            while [ "$p" != / ]; do sudo chmod o+x "$p"; p=$(dirname "$p"); done
          done
          chmod -R o+rX "$GITHUB_WORKSPACE"
      - run: bun test
        env:
          BUNWRITE_TEST_SANDBOX: '1'
          # GitHub's Ubuntu runners cannot start Chromium's sandbox (no unprivileged
          # user namespaces), so headless Chrome exits before the render starts.
          CHROME_NO_SANDBOX: 'true'
      - run: bun run build
      - run: ./dist/bunwrite --help
      # The SDK and CLI packages.
      - run: bunx tsc --noEmit -p packages/sdk
      - run: bunx tsc --noEmit -p packages/cli
      - run: bunx tsc --noEmit -p packages/mcp
      - run: bun run sdk:build && bun run cli:build
      - run: bun run mcp:build
      - run: node packages/cli/dist/cli.js --version
      - run: node packages/mcp/dist/mcp.js --version
