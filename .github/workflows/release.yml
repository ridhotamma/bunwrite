name: release

# Publishes the app image (and therefore the one-command installer) to GHCR.
# For Docker Hub, change REGISTRY/IMAGE_NAME, replace the login step with
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets, and use that image in the docs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example edge)
        required: true
        default: edge

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # BUNWRITE_IMAGE is baked into the image so `--entrypoint=install` points
      # the generated compose file back at the exact release it came from.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUNWRITE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            BUNWRITE_VERSION=${{ steps.meta.outputs.version }}
            # Released images are feature-complete: Python functions, HTML rendering and OCR.
            WITH_PYTHON=true
            WITH_CHROMIUM=true
            WITH_OCR=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail the release if the published image is missing an optional feature.
      - name: Smoke test the published image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
          docker pull "$image"
          docker run --rm --entrypoint sh "$image" -c '
            set -e
            bunwrite --help >/dev/null
            chromium --version
            # The container cannot start the Chromium sandbox; rendering must
            # not regress to "Chrome process closed the pipe".
            test "$CHROME_NO_SANDBOX" = "true"
            chromium --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --dump-dom "data:text/html,<h1>render-ok</h1>" | grep -q render-ok
            python3 --version
            tesseract --version
            tesseract --list-langs 2>/dev/null | grep -q '^eng$'
            litestream version
            docker --version
            docker compose version
          '
